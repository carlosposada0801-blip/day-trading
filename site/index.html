<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Streaks</title>
  <meta name="description" content="Count the days since you quit. Earn medals at 1, 3, 7, 14, 30, 60, 90 days and beyond.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Streaks">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="lock" class="lock" hidden>
    <div class="lock-inner">
      <div class="lock-title">Enter PIN</div>
      <div class="pin-dots" id="pin-dots" aria-live="polite"></div>
      <div class="keypad" id="keypad"></div>
      <div class="lock-err" id="lock-err" role="alert"></div>
    </div>
  </div>

  <div id="app" class="app">
    <header class="top">
      <h1>Streaks</h1>
      <button class="icon-btn" id="open-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </header>
    <main id="list" class="list" aria-live="polite"></main>
    <button class="fab" id="add" aria-label="New streak"><span aria-hidden="true">+</span> New streak</button>
  </div>

  <!-- Full-screen sheets; one open at a time -->
  <section id="detail" class="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="detail-title"></section>
  <section id="editor" class="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="editor-title"></section>
  <section id="settings" class="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="settings-title"></section>
  <section id="guide" class="sheet" hidden aria-modal="true" role="dialog" aria-label="Block it at the source"></section>
  <section id="urge" class="sheet urge" hidden aria-modal="true" role="dialog" aria-label="Ride out the urge"></section>
  <section id="celebrate" class="celebrate" hidden aria-modal="true" role="dialog" aria-label="Milestone reached">
    <canvas id="confetti" aria-hidden="true"></canvas>
    <div class="celebrate-card" id="celebrate-card"></div>
  </section>
  <section id="welcome" class="welcome" hidden aria-modal="true" role="dialog" aria-label="How Streaks works"></section>
  <section id="medal-info" class="celebrate" hidden aria-modal="true" role="dialog" aria-label="About this medal">
    <div class="celebrate-card info-card" id="medal-info-card"></div>
  </section>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
