# Your own website: `docker compose up -d` on a server whose DNS points at DOMAIN.
# Reads settings from .env (DOMAIN, APP_PASSWORD, SECRET_KEY, TOTP_SECRET, ...).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN}
      FORWARDED_ALLOW_IPS: "*"   # only Caddy can reach the app (no published port), so trust its headers
    volumes:
      - ./data:/data
      - ./strategy.toml:/app/strategy.toml:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
