<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Desk</title>
  <meta name="color-scheme" content="light dark">
  <script src="/static/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233e5cc5'/%3E%3Cpath d='M6 22l7-7 5 4 8-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login">
  <form method="post" action="/login" class="card login-card" data-2fa="0">
    <h1>Signal Desk</h1>
    <p class="meta">Private. Sign in to continue.</p>
    <input type="password" name="password" autocomplete="current-password" autofocus required aria-label="Password" placeholder="Password">
    <div id="code-row" hidden>
      <input name="code" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code"
             aria-label="6-digit code from your authenticator app" placeholder="6-digit code">
    </div>
    <button type="submit" class="buy">Sign in</button>
    <p class="meta err" id="err"></p>
  </form>
  <script src="/static/login.js"></script>
</body>
</html>
