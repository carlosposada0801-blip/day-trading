# Signal Desk autotrader rules. Edit, then restart the app.
# Every limit here is enforced in code before any order is sent.

[entry]
min_score = 40            # only buy when the blended score is at least this
min_confidence = 0.6      # ...and at least this much data backs it (0-1)
# Optional: require specific components to agree, e.g. { insiders = 0.1, news = 0 }
min_components = {}

[exit]
stop_loss_pct = 8         # sell if down this much from your average cost
take_profit_pct = 15      # sell if up this much
exit_score_below = 0      # sell if the score falls below this
max_hold_days = 20        # sell after holding this long
close_at_eod = false      # true = day-trade style: flatten everything before the close

[sizing]
position_pct = 15         # size of each new position, % of account equity
max_positions = 3         # few positions: a small account split 5+ ways is mostly dust
fractional = true         # buy fractions of a share, so $100 can own a piece of a $500 fund
min_order_usd = 5         # never place an order smaller than this

[risk]
daily_loss_limit_pct = 3  # halt new buys for the day if equity falls this much from the open
max_trades_per_day = 6
max_order_usd = 2000      # hard cap on any single order
max_position_pct = 20     # no position may grow past this % of equity
max_failed_sources = 1    # skip new buys if more data sources than this are failing
# Pattern-day-trader limit. The SEC approved removing the PDT rule in April 2026 but brokers
# have until Oct 2027 to switch. Set to -1 only after confirming Robinhood no longer applies it.
max_day_trades_per_5d = 3
avoid_wash_sales = true   # don't rebuy within 30 days of selling that stock at a loss
no_trade_open_minutes = 15
no_trade_close_minutes = 15
limit_band_pct = 0.5      # limit orders at last price +/- this %, never market orders

[schedule]
interval_min = 5          # how often the autotrader runs during market hours
proposal_ttl_min = 15     # approval requests expire after this (prices go stale)

[autopilot]
# Hands-off investing: deposits are detected and invested, profits are set aside for you to withdraw.
# Most of the money sits in a broad index fund ("core"); the signal strategy trades the rest.
core_symbol = "VOO"
core_pct = 60               # % of investable money in the core fund. 0 = everything follows signals.
cash_reserve_pct = 5        # always keep this % in cash
rebalance_band_pct = 5      # rebalance the core only when it drifts this far from target
core_max_order_usd = 5000   # invest big deposits in steps no larger than this
profit_pull_trigger_pct = 10   # once you're up this % on what you deposited...
profit_pull_share_pct = 50     # ...set this share of the profit aside as cash and tell you to withdraw it
min_pull_usd = 25
weekly_summary = true       # phone summary after Friday's close
expected_deposit_usd = 100  # your paycheck deposit; you get a nudge if one is more than 3 days late
deposit_every_days = 14     # every two weeks (use 7 for weekly, 15 for twice a month)

[penny]
# Stocks under $5 in their own small, stricter sleeve. High risk: read the README first.
enabled = true
budget_pct = 10             # % of your money for penny stocks (taken out of the signal-trading share)
max_positions = 2
min_price = 0.50            # under 50 cents, delisting and manipulation risk is extreme
max_price = 5.00
min_dollar_volume = 1000000 # must trade $1M+/day on average, so you can actually sell
min_score = 50              # stricter than regular buys
min_confidence = 0.5
stop_loss_pct = 15          # penny stocks swing hard; tighter stops get triggered by noise
take_profit_pct = 30
max_hold_days = 10
pump_guard = true           # refuse big run-ups driven by social hype with no real news
pump_run_up_pct = 50
scan_trending = true        # look at penny tickers trending on Reddit
watchlist = []              # penny tickers you always want checked, e.g. ["ABCD", "WXYZ"]

[robinhood]
mcp_url = "https://agent.robinhood.com/mcp/trading"
# If Robinhood names its tools differently, map them here, e.g. positions = "get_equity_positions"
tools = {}
# Fixed extra arguments added to every order, e.g. { account_number = "..." }
order_args = {}
